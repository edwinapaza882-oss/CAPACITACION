{% extends 'base.html' %}
{% block content %}
<h2>Cursos</h2>
<a href="{{ url_for('nuevo_curso') }}" class="btn btn-success mb-3">Nuevo</a>

<table class="table table-striped align-middle">
    <thead class="table-dark-header">
        <tr>
            <th>Id</th>
            <th>Descripción</th>
            <th>Horas</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for c in cursos %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.descripcion }}</td>
            <td>{{ c.horas }}</td>
            <td>
                <a href="{{ url_for('editar_curso', id=c.id) }}" class="btn btn-warning btn-sm text-white">Editar</a>
                <a href="{{ url_for('eliminar_curso', id=c.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro ??')">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
