estudiantes.html

{% extends 'base.html' %}
{% block content %}
<h2>Estudiantes</h2>
<a href="{{ url_for('nuevo_estudiante') }}" class="btn btn-success mb-3">Nuevo</a>

<table class="table table-striped align-middle">
    <thead class="table-dark-header">
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Fecha Nacimiento</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for e in estudiantes %}
        <tr>
            <td>{{ e.id }}</td>
            <td>{{ e.nombre }}</td>
            <td>{{ e.apellidos }}</td>
            <td>{{ e.fecha_nacimiento }}</td>
            <td>
                <a href="{{ url_for('eliminar_estudiante', id=e.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro ??')">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
